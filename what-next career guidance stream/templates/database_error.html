{% extends "base.html" %}

{% block title %}Database connection error | What Next?{% endblock %}

{% block content %}
<section class="auth-section">
    <div class="auth-card">
        <h1>Service temporarily unavailable</h1>
        <p>The website could not connect to its database. Please try again later.</p>
        <p><strong>Database error:</strong></p>
        <pre>{{ error_message }}</pre>
    </div>
</section>
{% endblock %}
